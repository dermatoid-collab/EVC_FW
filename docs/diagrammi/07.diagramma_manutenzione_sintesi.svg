<text x="130.0" y="541" font-size="15" text-anchor="middle" font-weight="bold" fill="#2a3b55">Messa in servizio</text>
<circle cx="413.3333333333333" cy="495" r="16" fill="#2e8b57"/>
<text x="413.3333333333333" y="501" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="413.3333333333333" y="541" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b57">6 mesi</text>
<circle cx="696.6666666666666" cy="495" r="16" fill="#2e8b57"/>
<text x="696.6666666666666" y="501" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="696.6666666666666" y="541" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b57">12 mesi</text>
<circle cx="980.0" cy="495" r="16" fill="#2e8b57"/>
<text x="980.0" y="501" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="980.0" y="541" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b57">18 mesi</text>
<circle cx="1263.3333333333333" cy="495" r="16" fill="#2e8b57"/>
<text x="1263.3333333333333" y="501" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="1263.3333333333333" y="541" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b57">24 mesi</text>
<circle cx="1546.6666666666667" cy="495" r="16" fill="#2e8b57"/>
<text x="1546.6666666666667" y="501" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="1546.6666666666667" y="541" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b57">30 mesi</text>
<circle cx="1830.0" cy="495" r="16" fill="#2e8b57"/>
<text x="1830.0" y="501" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="1830.0" y="541" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b57">36 mesi</text>
<rect x="1800" y="433" width="120" height="38" rx="10" fill="#fff6ee" stroke="#d35400" stroke-width="3"/>
<text x="1860" y="459" font-size="17" text-anchor="middle" font-weight="bold" fill="#d35400">Batterie</text>
