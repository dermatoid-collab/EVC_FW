<circle cx="46" cy="630" r="20" fill="#2563eb"/>
<text x="46" y="637" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="78" y="638" font-size="24" text-anchor="start" font-weight="bold" fill="#2563eb">Cosa si controlla: 22 procedure nel piano di controllo</text>
<rect x="30" y="660" width="625" height="90" rx="12" fill="#fff" stroke="#c7d6ee" stroke-width="2"/>
<circle cx="64" cy="705.0" r="15" fill="#2563eb"/>
<text x="64" y="711.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="96" y="698" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2937">Movimento</text>
<text x="96" y="726" font-size="15" text-anchor="start" font-weight="normal" fill="#4b5563">fermate, velocità, sovraccarico</text>
<rect x="687" y="660" width="625" height="90" rx="12" fill="#fff" stroke="#c7d6ee" stroke-width="2"/>
<circle cx="721" cy="705.0" r="15" fill="#2563eb"/>
<text x="721" y="711.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="753" y="698" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2937">Porte e cabina</text>
<text x="753" y="726" font-size="15" text-anchor="start" font-weight="normal" fill="#4b5563">serrature, luci, bordi sensibili, segnaletica</text>
<rect x="1344" y="660" width="625" height="90" rx="12" fill="#fff" stroke="#c7d6ee" stroke-width="2"/>
<circle cx="1378" cy="705.0" r="15" fill="#2563eb"/>
<text x="1378" y="711.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="1410" y="698" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2937">Emergenza</text>
<text x="1410" y="726" font-size="15" text-anchor="start" font-weight="normal" fill="#4b5563">alimentazione di emergenza, batterie</text>
<rect x="30" y="764" width="625" height="90" rx="12" fill="#fff" stroke="#c7d6ee" stroke-width="2"/>
<circle cx="64" cy="809.0" r="15" fill="#2563eb"/>
<text x="64" y="815.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="96" y="802" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2937">Sicurezze</text>
<text x="96" y="830" font-size="15" text-anchor="start" font-weight="normal" fill="#4b5563">paracadute, finecorsa, sensori cinghie</text>
<rect x="687" y="764" width="625" height="90" rx="12" fill="#fff" stroke="#c7d6ee" stroke-width="2"/>
<circle cx="721" cy="809.0" r="15" fill="#2563eb"/>
<text x="721" y="815.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="753" y="802" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2937">Trazione</text>
<text x="753" y="830" font-size="15" text-anchor="start" font-weight="normal" fill="#4b5563">cinghie, pulegge, rotelle, guide</text>
<rect x="1344" y="764" width="625" height="90" rx="12" fill="#fff" stroke="#c7d6ee" stroke-width="2"/>
<circle cx="1378" cy="809.0" r="15" fill="#2563eb"/>
<text x="1378" y="815.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">✓</text>
<text x="1410" y="802" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2937">Impianto elettrico</text>
<text x="1410" y="830" font-size="15" text-anchor="start" font-weight="normal" fill="#4b5563">messa a terra e linee</text>
<rect x="30" y="880" width="625" height="70" rx="10" fill="#fff" stroke="#7b3fa0" stroke-width="2.5"/>
<text x="52" y="906" font-size="17" text-anchor="start" font-weight="bold" fill="#7b3fa0">Aree di intervento</text>
<text x="52" y="932" font-size="14.5" text-anchor="start" font-weight="normal" fill="#1f2937">Vano motore in testata e sopra la pedana di carico (cabina al piano 0).</text>
<rect x="687" y="880" width="625" height="70" rx="10" fill="#fff" stroke="#7b3fa0" stroke-width="2.5"/>
<text x="709" y="906" font-size="17" text-anchor="start" font-weight="bold" fill="#7b3fa0">Personale qualificato e ricambi originali</text>
<text x="709" y="932" font-size="14.5" text-anchor="start" font-weight="normal" fill="#1f2937">Controlli semplici a cura dell&#x27;utente: vedi manuale d&#x27;uso.</text>
<rect x="1344" y="880" width="625" height="70" rx="10" fill="#fff" stroke="#7b3fa0" stroke-width="2.5"/>
<text x="1366" y="906" font-size="17" text-anchor="start" font-weight="bold" fill="#7b3fa0">Diagnosi guidata</text>
<text x="1366" y="932" font-size="14.5" text-anchor="start" font-weight="normal" fill="#1f2937">Il quadro memorizza gli eventi e li mostra sul display.</text>
<text x="30" y="982" font-size="13.5" text-anchor="start" font-weight="bold" fill="#4b5563">* Stima del costruttore per uso residenziale (circa 300 corse al mese).</text>
<text x="30" y="1002" font-size="13.5" text-anchor="start" font-weight="bold" fill="#4b5563">† Garanzia estesa alle condizioni e con le esclusioni previste dal manuale di manutenzione.</text>
<text x="30" y="1020" font-size="12.5" text-anchor="start" font-weight="normal" fill="#4b5563">Fonti: CP.TEC.025 Rev.5, istruzioni di manutenzione IM.TEC.159, analisi dei rischi Rev.7, ufficio tecnico LiftingItalia.</text>
