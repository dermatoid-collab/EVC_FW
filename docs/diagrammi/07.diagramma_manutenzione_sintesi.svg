<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1030" viewBox="0 0 2000 1030" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="2000" height="1030" fill="#f7f8fa"/>
<rect x="0" y="0" width="2000" height="92" rx="0" fill="#2a3b55" stroke="#2a3b55" stroke-width="0"/>
<text x="30" y="44" font-size="32" text-anchor="start" font-weight="bold" fill="#fff">ELEVANCE — Manutenzione in una pagina</text>
<text x="30" y="72" font-size="17" text-anchor="start" font-weight="normal" fill="#dbe4f0">Controlli programmati, batterie ogni 3 anni · sintesi visuale per il commerciale</text>
<text x="1970" y="40" font-size="16" text-anchor="end" font-weight="bold" fill="#fff">Aggiornata al 08/11/2026 · non contrattuale</text>
<text x="1970" y="66" font-size="14" text-anchor="end" font-weight="normal" fill="#dbe4f0">Intervalli e obblighi di manutenzione possono variare secondo le norme di ciascun Paese.</text>
<circle cx="46" cy="130" r="20" fill="#2a3b55"/>
<text x="46" y="137" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="78" y="138" font-size="24" text-anchor="start" font-weight="bold" fill="#2a3b55">In quattro numeri</text>
<rect x="30" y="160" width="465" height="190" rx="14" fill="#fff" stroke="#2e8b57" stroke-width="3"/>
<text x="262.5" y="235" font-size="56" text-anchor="middle" font-weight="bold" fill="#2e8b57">6 mesi</text>
<text x="262.5" y="278" font-size="21" text-anchor="middle" font-weight="bold" fill="#1f2937">controllo programmato</text>
<text x="262.5" y="312" font-size="15" text-anchor="middle" font-weight="normal" fill="#4b5563">a cura di personale qualificato</text>
<rect x="522" y="160" width="465" height="190" rx="14" fill="#fff" stroke="#d35400" stroke-width="3"/>
<text x="754.5" y="235" font-size="56" text-anchor="middle" font-weight="bold" fill="#d35400">3 anni</text>
<text x="754.5" y="278" font-size="21" text-anchor="middle" font-weight="bold" fill="#1f2937">sostituzione batterie</text>
<text x="754.5" y="312" font-size="15" text-anchor="middle" font-weight="normal" fill="#4b5563">AGM sigillate, senza manutenzione ordinaria</text>
<rect x="1014" y="160" width="465" height="190" rx="14" fill="#fff" stroke="#7b3fa0" stroke-width="3"/>
<text x="1246.5" y="235" font-size="56" text-anchor="middle" font-weight="bold" fill="#7b3fa0">5 anni</text>
<text x="1246.5" y="278" font-size="21" text-anchor="middle" font-weight="bold" fill="#1f2937">garanzia estesa†</text>
<text x="1246.5" y="312" font-size="15" text-anchor="middle" font-weight="normal" fill="#4b5563">12 mesi di legge più 4 anni di estensione</text>
<rect x="1506" y="160" width="465" height="190" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="1738.5" y="235" font-size="56" text-anchor="middle" font-weight="bold" fill="#2563eb">≈ 0 €</text>
<text x="1738.5" y="278" font-size="21" text-anchor="middle" font-weight="bold" fill="#1f2937">costo delle parti di consumo*</text>
<text x="1738.5" y="312" font-size="15" text-anchor="middle" font-weight="normal" fill="#4b5563">escluse le batterie ogni 3 anni</text>
<circle cx="46" cy="402" r="20" fill="#2e8b57"/>
<text x="46" y="409" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="78" y="410" font-size="24" text-anchor="start" font-weight="bold" fill="#2e8b57">I primi tre anni</text>
<rect x="30" y="430" width="1940" height="150" rx="14" fill="#fff" stroke="#d5dbe3" stroke-width="1.5"/>
<line x1="130" y1="495" x2="1830" y2="495" stroke="#6b7280" stroke-width="6"/>
<circle cx="130.0" cy="495" r="16" fill="#2a3b55"/>
